<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氣球獵人｜遊戲首頁</title>
<style>
:root{--purple:#7168ed;--ink:#34345f;--muted:#777c9d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(160deg,#dff6ff 0%,#eae7ff 54%,#fff0f6 100%);display:flex;align-items:center;justify-content:center}.page{width:min(100%,760px);overflow:hidden;border:1px solid #ffffffbd;border-radius:30px;background:#ffffffa8;box-shadow:0 20px 60px #6465a326}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 24px}.brand{font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:9px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;background:white;border-radius:13px;font-size:22px}.pill{font-size:11px;letter-spacing:1px;font-weight:800;color:#7168c4;background:#fff;padding:8px 12px;border-radius:99px}.hero{text-align:center;padding:8px 24px 24px}.eyebrow{font-size:12px;letter-spacing:4px;font-weight:900;color:#8a80ce}.hero h1{font-size:clamp(36px,8vw,62px);line-height:1.12;margin:12px 0 8px;letter-spacing:-2px;color:#5148b5}.hero h1 span{display:block;font-size:.47em;letter-spacing:5px;margin-top:9px;color:#7770bd}.desc{font-size:15px;line-height:1.9;color:#707493;margin:12px auto 20px;max-width:440px}.sky{position:relative;height:190px;max-width:520px;margin:0 auto 18px;border-radius:26px;overflow:hidden;background:linear-gradient(#aee5ff,#e7f8ff 75%,#d7f2d2)}.sun{position:absolute;right:14%;top:20px;width:45px;height:45px;border-radius:50%;background:#fff0a9;box-shadow:0 0 0 10px #fff0a933}.cloud{position:absolute;font-size:42px;opacity:.9}.c1{top:17px;left:7%}.c2{top:46px;right:7%;font-size:33px}.balloon{position:absolute;font-size:62px;filter:drop-shadow(0 6px 4px #58709b24);animation:float 3s ease-in-out infinite}.b1{left:20%;top:55px;transform:rotate(-12deg)}.b2{left:42%;top:25px;animation-delay:.4s}.b3{right:19%;top:61px;animation-delay:.8s}.b4{right:36%;top:87px;font-size:45px;animation-delay:1.1s}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}.ground{position:absolute;bottom:-38px;left:-10%;width:120%;height:75px;border-radius:50%;background:#a8e2a4}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 20px}.btn{border:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 25px;border-radius:16px;font-size:15px;font-weight:850;cursor:pointer;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--purple);color:#fff;box-shadow:0 6px 0 #5149c3}.secondary{background:#fff;color:#625bb7;border:1px solid #e4e0ff}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 24px 22px}.rule{background:#fff;border:1px solid #f0efff;border-radius:18px;padding:17px 12px;text-align:center}.rule .emoji{font-size:28px}.rule strong{display:block;margin:7px 0 4px;font-size:14px}.rule p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}.foot{text-align:center;padding:0 16px 22px;font-size:11px;color:#8b8eaa;letter-spacing:1px}@media(max-width:480px){body{padding:10px}.page{border-radius:23px}.nav{padding:16px}.hero{padding:8px 15px 18px}.sky{height:165px}.balloon{font-size:52px}.b4{font-size:39px}.rules{padding:0 13px 18px;gap:7px}.rule{padding:13px 7px}.rule p{font-size:11px}.btn{width:100%}.actions{padding:0 10px}}
</style>
</head>
<body>
<main class="page">
  <nav class="nav"><div class="brand"><span class="brand-mark">🎈</span> BALLOON POP</div><span class="pill">MINI ARCADE</span></nav>
  <section class="hero">
    <div class="eyebrow">★ READY · SET · POP! ★</div>
    <h1>氣球獵人<span>BALLOON POP!</span></h1>
    <p class="desc">瞄準氣球，避開炸彈！<br>準備好迎接越來越刺激的反應力挑戰了嗎？</p>
    <div class="sky" aria-label="天空與彩色氣球插畫"><div class="sun"></div><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><span class="balloon b1">🎈</span><span class="balloon b2">🩷</span><span class="balloon b3">💜</span><span class="balloon b4">💛</span><div class="ground"></div></div>
    <div class="actions"><a class="btn primary" href="氣球獵人遊戲.html">▶　開始遊戲</a><a class="btn secondary" href="#rules">✦　查看玩法</a></div>
  </section>
  <section class="rules" id="rules">
    <div class="rule"><div class="emoji">🎈</div><strong>點擊氣球</strong><p>每個氣球可獲得<br>+10 分</p></div>
    <div class="rule"><div class="emoji">💣</div><strong>小心炸彈</strong><p>點到炸彈就會<br>失去一條生命</p></div>
    <div class="rule"><div class="emoji">⏱️</div><strong>限時挑戰</strong><p>在 30 秒內<br>努力拿高分</p></div>
  </section>
  <footer class="foot">CUTE BALLOONS · QUICK REFLEXES · HAVE FUN!</footer>
</main>
</body>
</html>
